[project]
name = "template-ml-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi","uvicorn","httpx","pydantic","numpy","pandas"]

[project.optional-dependencies]
dev = ["pytest","ruff","mypy","types-requests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
